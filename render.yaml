services:
  - type: web
    name: research-run-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn server:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: MONGO_URL
        sync: false        # set to your MongoDB Atlas connection string
      - key: DB_NAME
        value: research_run
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_TPM_LIMIT
        value: "5500"
      - key: GROQ_RPM_LIMIT
        value: "28"
      - key: CORS_ORIGINS
        sync: false        # set to your Vercel frontend URL, e.g. https://your-app.vercel.app
